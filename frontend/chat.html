<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title id="pageTitle"></title>

    <link rel="stylesheet" href="styles.css" />
    <link
      id="favicon"
      rel="icon"
      type="image/png"
      href="./assets/answerly_favicon.png"
    />
  </head>

  <body class="customer-chat-page">
    <div class="customer-chat-shell">
      <header class="customer-chat-header">
        <a id="companyBrandLink" class="brand" href="chat.html">
          <span id="logo" class="logo">
            <img id="brandLogo" alt="" hidden />
            <span id="logoInitial"></span>
          </span>
        </a>
      </header>

      <main class="customer-chat-main">
        <section class="customer-chat-card">
          <div class="customer-chat-title">
            <div class="customer-chat-title-row">
              <span class="assistant-avatar" aria-hidden="true">
                <img id="assistantAvatar" alt="" hidden />
                <span id="assistantAvatarFallback"></span>
              </span>

              <div class="customer-chat-title-copy">
                <h1 id="chatTitle"></h1>
                <p id="chatSubtitle"></p>
              </div>
            </div>
          </div>

          <div id="messages" class="customer-messages"></div>

          <form id="chatForm" class="customer-input-wrap">
            <textarea
                id="questionInput"
                class="customer-input"
                rows="1"
                placeholder="Type your question..."
                autocomplete="off"
              ></textarea>

            <button id="sendButton" class="btn customer-send" type="submit">
              Send
            </button>
          </form>
        </section>
      </main>
    </div>

    <script src="config.js"></script>
    <script src="api.js"></script>

    <script>
      const messages = document.getElementById("messages");
      const chatForm = document.getElementById("chatForm");
      const questionInput = document.getElementById("questionInput");
      const sendButton = document.getElementById("sendButton");

      const conversationHistory = [];

      let activeMode;

      function getActiveMode() {
        const params = new URLSearchParams(window.location.search);
        const requestedMode = params.get("mode");

        if (requestedMode) {
          if (COMPANY_CONFIG.modes?.[requestedMode]?.enabled) {
            return requestedMode;
          }

          throw new Error(`Assistant mode '${requestedMode}' is not available.`);
        }

        const enabledModes = Object.entries(COMPANY_CONFIG.modes || {})
          .filter(([, config]) => config?.enabled)
          .map(([mode]) => mode);

        if (enabledModes.length === 1) {
          return enabledModes[0];
        }

        throw new Error(
          "Assistant mode must be specified when multiple assistants are enabled.",
        );
      }

      async function initializeChat() {
        await loadCompanyConfig();

        activeMode = getActiveMode();

        document.title = `${COMPANY_CONFIG.company_name} — ${COMPANY_CONFIG.assistant.title}`;

        document.getElementById("pageTitle").textContent = document.title;

        document
          .getElementById("companyBrandLink")
          .setAttribute("aria-label", `${COMPANY_CONFIG.company_name} chat`);

        applyBrandLogo(
          document.getElementById("brandLogo"),
          document.getElementById("logoInitial"),
        );

        applyAssistantAvatar(
          document.getElementById("assistantAvatar"),
          document.getElementById("assistantAvatarFallback"),
        );
        document.getElementById("chatTitle").textContent =
          COMPANY_CONFIG[activeMode].chat_headline;

        document.getElementById("chatSubtitle").textContent =
          COMPANY_CONFIG[activeMode].chat_description;

        questionInput.placeholder = COMPANY_CONFIG[activeMode].placeholder;

        const greeting =
          COMPANY_CONFIG.modes?.[activeMode]?.conversation?.greeting ||
          COMPANY_CONFIG.conversation?.greeting;

        if (greeting?.enabled) {
          addMessage("assistant", greeting.message);
        }
      }
      initializeChat().catch((error) => {
        console.error("Chat initialization failed:", error);
        showChatConfigurationError();
      });

      window.addEventListener("load", () => {
        if (!questionInput.disabled) {
          questionInput.focus();
        }
      });

      function addMessage(role, text) {
        const message = document.createElement("div");

        message.className = `customer-message ${role}`;
        message.textContent = text;

        messages.appendChild(message);
        messages.scrollTop = messages.scrollHeight;
      }

      function shouldShowCitations() {
        return (
          COMPANY_CONFIG.modes?.[activeMode]?.show_citations === true ||
          COMPANY_CONFIG.visibility?.[activeMode]?.show_citations === true
        );
      }

      function addAssistantMessage(text, sources = []) {
        const message = document.createElement("div");

        message.className = "customer-message assistant";

        const answer = document.createElement("div");
        answer.textContent = text;

        message.appendChild(answer);

        if (shouldShowCitations() && sources.length > 0) {
          const uniqueSources = [
            ...new Set(
              sources
                .map((source) => source.source)
                .filter(Boolean),
            ),
          ];

          if (uniqueSources.length > 0) {
            const citationBlock = document.createElement("div");
            citationBlock.className = "customer-message-sources";

            const heading = document.createElement("strong");
            heading.textContent =
              uniqueSources.length === 1 ? "Source" : "Sources";

            const list = document.createElement("ul");

            for (const sourceName of uniqueSources) {
              const item = document.createElement("li");
              item.textContent = sourceName;
              list.appendChild(item);
            }

            citationBlock.appendChild(heading);
            citationBlock.appendChild(list);

            message.appendChild(citationBlock);
          }
        }

        messages.appendChild(message);
        messages.scrollTop = messages.scrollHeight;
      }

      function addLoadingMessage() {
        const message = document.createElement("div");

        message.className = "customer-message assistant loading";
        message.id = "loadingMessage";
        message.textContent = COMPANY_CONFIG[activeMode].loading_message;

        messages.appendChild(message);
        messages.scrollTop = messages.scrollHeight;
      }

      function removeLoadingMessage() {
        const loading = document.getElementById("loadingMessage");

        if (loading) {
          loading.remove();
        }
      }

      function showChatConfigurationError() {
        document.getElementById("chatTitle").textContent =
          "Chat unavailable";

        document.getElementById("chatSubtitle").textContent =
          "This chat link is not configured for an assistant.";

        messages.replaceChildren();

        addMessage(
          "assistant",
          "Please use the correct assistant link provided by the company.",
        );

        questionInput.disabled = true;
        sendButton.disabled = true;
      }

      function buildContextualQuestion(currentQuestion) {
        const lower = currentQuestion.toLowerCase();

        const followUpPatterns = [
          "it",
          "that",
          "this",
          "they",
          "them",
          "those",
          "what about",
          "how about",
          "tell me more",
          "more about",
          "what kind",
          "which one",
          "is it",
          "are they",
        ];

        const looksLikeFollowUp = followUpPatterns.some((pattern) =>
          lower.includes(pattern),
        );

        if (!looksLikeFollowUp || conversationHistory.length === 0) {
          return currentQuestion;
        }

        const recentHistory = conversationHistory
          .slice(-2)
          .map((message) => `${message.role}: ${message.text}`)
          .join("\n");

        return `
      Conversation so far:
      ${recentHistory}

      Latest user question:
      ${currentQuestion}

      Answer the latest user question using the available knowledge base.

      Use the conversation only to understand references such as "it", "that", or "they".
      `.trim();
      }

      function customerFriendlyAnswer(answer) {
        const refusal =
          "I could not find enough information to answer that confidently.";

        if (answer.trim() === refusal) {
          return COMPANY_CONFIG[activeMode].fallback_message;
        }

        return answer;
      }

      async function handleQuestion(question) {
        const cleanQuestion = question.trim();

        if (!cleanQuestion) {
          return;
        }

        addMessage("user", cleanQuestion);

        conversationHistory.push({
          role: "User",
          text: cleanQuestion,
        });

        questionInput.value = "";
        questionInput.disabled = true;
        sendButton.disabled = true;
        sendButton.textContent = "Sending";

        addLoadingMessage();

        try {
          const contextualQuestion = buildContextualQuestion(cleanQuestion);

          const result = await askQuestion(contextualQuestion, activeMode);

          const cleanAnswer = customerFriendlyAnswer(
            result.answer || "I could not answer that question.",
          );

          removeLoadingMessage();

          addAssistantMessage(
            cleanAnswer,
            result.sources || [],
          );

          conversationHistory.push({
            role: COMPANY_CONFIG.assistant.name,
            text: cleanAnswer,
          });
        } catch (error) {
          removeLoadingMessage();

          addMessage(
            "assistant",
            "Sorry, something went wrong while answering. Please try again.",
          );
        } finally {
          questionInput.disabled = false;
          sendButton.disabled = false;
          sendButton.textContent = "Send";
          questionInput.focus();
        }
      }

      questionInput.addEventListener("keydown", (event) => {
        if (
          event.key === "Enter" &&
          !event.shiftKey &&
          !event.isComposing
        ) {
          event.preventDefault();
          chatForm.requestSubmit();
        }
      });

      chatForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        await handleQuestion(questionInput.value);
      });
    </script>
  </body>
</html>
