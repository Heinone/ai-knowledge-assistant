<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title id="pageTitle"></title>

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body class="customer-chat-page">
    <div class="customer-chat-shell">
      <header class="customer-chat-header">
        <a class="brand" href="chat.html">
          <span id="logo" class="logo"></span>
          <span id="assistantBrand"></span>
        </a>

        <span class="badge badge-success"> Online </span>
      </header>

      <main class="customer-chat-main">
        <section class="customer-chat-card">
          <div class="customer-chat-title">
            <h1 id="chatTitle"></h1>
            <p id="chatSubtitle"></p>
          </div>

          <div id="messages" class="customer-messages"></div>

          <form id="chatForm" class="customer-input-wrap">
            <input
              id="questionInput"
              class="customer-input"
              type="text"
              placeholder="Type your question..."
              autocomplete="off"
            />

            <button id="sendButton" class="btn customer-send" type="submit">
              Send
            </button>
          </form>
        </section>
      </main>
    </div>

    <script src="config.js"></script>
    <script src="api.js"></script>

    <script>
      const messages = document.getElementById("messages");
      const chatForm = document.getElementById("chatForm");
      const questionInput = document.getElementById("questionInput");
      const sendButton = document.getElementById("sendButton");

      const conversationHistory = [];

      // Apply configuration

      await loadCompanyConfig();

      document.title = `${COMPANY_CONFIG.company_name} — ${COMPANY_CONFIG.assistant.title}`;

      document.getElementById("pageTitle").textContent =
        COMPANY_CONFIG.pageTitle;

      document.getElementById("logo").textContent = COMPANY_CONFIG.logoText;

      document.getElementById("assistantBrand").textContent =
        `${COMPANY_CONFIG.assistantName} by ${COMPANY_CONFIG.companyName}`;

      document.getElementById("chatTitle").textContent =
        `${COMPANY_CONFIG.companyName} ${COMPANY_CONFIG.assistantRole}`;

      document.getElementById("chatSubtitle").textContent =
        COMPANY_CONFIG.chatSubtitle;

      addMessage("assistant", COMPANY_CONFIG.welcomeMessage);

      window.addEventListener("load", () => {
        questionInput.focus();
      });

      function addMessage(role, text) {
        const message = document.createElement("div");

        message.className = `customer-message ${role}`;
        message.textContent = text;

        messages.appendChild(message);
        messages.scrollTop = messages.scrollHeight;
      }

      function addLoadingMessage() {
        const message = document.createElement("div");

        message.className = "customer-message assistant loading";
        message.id = "loadingMessage";
        message.textContent = COMPANY_CONFIG.loadingMessage;

        messages.appendChild(message);
        messages.scrollTop = messages.scrollHeight;
      }

      function removeLoadingMessage() {
        const loading = document.getElementById("loadingMessage");

        if (loading) {
          loading.remove();
        }
      }

      function buildContextualQuestion(currentQuestion) {
        const lower = currentQuestion.toLowerCase();

        const followUpPatterns = [
          "it",
          "that",
          "this",
          "they",
          "them",
          "those",
          "what about",
          "how about",
          "tell me more",
          "more about",
          "what kind",
          "which one",
          "is it",
          "are they",
        ];

        const looksLikeFollowUp = followUpPatterns.some((pattern) =>
          lower.includes(pattern),
        );

        if (!looksLikeFollowUp || conversationHistory.length === 0) {
          return currentQuestion;
        }

        const recentHistory = conversationHistory
          .slice(-2)
          .map((message) => `${message.role}: ${message.text}`)
          .join("\n");

        return `
Conversation so far:
${recentHistory}

Customer's latest question:
${currentQuestion}

Answer the latest customer question using the available knowledge base.

Use the conversation only to understand references such as "it", "that", or "they".
`.trim();
      }

      function customerFriendlyAnswer(answer) {
        const refusal =
          "I could not find enough information to answer that confidently.";

        if (answer.trim() === refusal) {
          return COMPANY_CONFIG.fallbackMessage;
        }

        return answer;
      }

      async function handleQuestion(question) {
        const cleanQuestion = question.trim();

        if (!cleanQuestion) {
          return;
        }

        addMessage("user", cleanQuestion);

        conversationHistory.push({
          role: "Customer",
          text: cleanQuestion,
        });

        questionInput.value = "";
        questionInput.disabled = true;
        sendButton.disabled = true;
        sendButton.textContent = "Sending";

        addLoadingMessage();

        try {
          const contextualQuestion = buildContextualQuestion(cleanQuestion);

          const result = await askQuestion(contextualQuestion);

          const cleanAnswer = customerFriendlyAnswer(
            result.answer || "I could not answer that question.",
          );

          removeLoadingMessage();

          addMessage("assistant", cleanAnswer);

          conversationHistory.push({
            role: COMPANY_CONFIG.assistantName,
            text: cleanAnswer,
          });
        } catch (error) {
          removeLoadingMessage();

          addMessage(
            "assistant",
            "Sorry, something went wrong while answering. Please try again.",
          );
        } finally {
          questionInput.disabled = false;
          sendButton.disabled = false;
          sendButton.textContent = "Send";
          questionInput.focus();
        }
      }

      chatForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        await handleQuestion(questionInput.value);
      });
    </script>
  </body>
</html>
